<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  qSnapper D-Bus system bus policy (per-member ACL, deny-by-default).

  SUSE Security Review (2026-04) P2:
    Previously this file allowed any method_call to reach the service,
    which forced the service itself to reject unknown/unauthorized calls.
    Starting from v1.3.3 the bus daemon itself rejects everything except
    the 21 methods declared in dbus/com.presire.qsnapper.Operations.xml,
    plus the standard Introspectable and Peer helpers.

  IMPORTANT:
    When adding, renaming or removing a D-Bus method in
    dbus/com.presire.qsnapper.Operations.xml you MUST also update the
    <allow send_member="..."/> list below, otherwise legitimate clients
    will receive org.freedesktop.DBus.Error.AccessDenied from the bus.
-->

<busconfig>

  <!-- Only root may own the well-known service name. -->
  <!-- サービス名を所有できるのはrootユーザのみである。 -->
  <policy user="root">
    <allow own="com.presire.qsnapper.Operations"/>
  </policy>

  <!--
    Default policy: deny every method_call to our destination, then
    re-allow exactly the members that are part of our public API.
    Fine-grained authorization (who may actually run each method) is
    still enforced by PolicyKit inside the service; this layer only
    closes the attack surface exposed through the bus daemon itself.
  -->
  <!--
    デフォルト: 本サービス宛の method_call をすべて拒否した上で、
    公開APIとなる個別メソッドだけを再許可する。
    「誰が実行できるか」の細粒度認可は従来通りサービス内のPolicyKitで行う。
    ここでバス層の攻撃面 (未知メソッドの露出) を閉じるのが目的。
  -->
  <policy context="default">

    <!-- Deny everything targeted at our service by default. -->
    <deny send_destination="com.presire.qsnapper.Operations"/>

    <!-- ===== Public API: com.presire.qsnapper.Operations ===== -->
    <!-- Keep this list in sync with dbus/com.presire.qsnapper.Operations.xml. -->

    <!-- Configuration enumeration / status -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="ListConfigs"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="IsConfigured"/>

    <!-- Snapshot enumeration -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="ListSnapshots"/>

    <!-- Snapshot lifecycle -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="CreateSnapshot"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="ModifySnapshot"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="DeleteSnapshot"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="RollbackSnapshot"/>

    <!-- Diff / file change inspection (gated by view-diff polkit action) -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="GetFileChanges"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="GetFileChangesBetween"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="GetFileDiffAndDetails"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="GetFileDiffBetween"/>

    <!-- Restore (path validation enforced inside the service) -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="RestoreFiles"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="RestoreFilesDirect"/>

    <!-- Staged restore (single-authorization path) -->
    <!-- Pre-freeze: bounded chunk staging, no Polkit authorization yet. -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="BeginRestorePlan"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="StageRestoreEntries"/>
    <!-- Freeze + single authorization, then post-freeze control methods
         that accept ONLY a manifest identifier (no path/type/config/
         snapshot/mode may appear post-freeze). -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="CommitRestorePlan"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="ContinueRestorePlan"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="GetRestorePlanStatus"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="CancelRestorePlan"/>

    <!-- Config write / quota setup -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="WriteSnapperConfig"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="com.presire.qsnapper.Operations"
           send_member="SetupQuota"/>

    <!-- ===== Standard D-Bus helpers ===== -->

    <!-- Introspection: needed by qdbusviewer / busctl introspect / debugging. -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>

    <!-- Peer: liveness / machine-id checks used by Qt D-Bus clients. -->
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="org.freedesktop.DBus.Peer"
           send_member="Ping"/>
    <allow send_destination="com.presire.qsnapper.Operations"
           send_type="method_call"
           send_interface="org.freedesktop.DBus.Peer"
           send_member="GetMachineId"/>

    <!--
      org.freedesktop.DBus.Properties.* is intentionally NOT allowed:
      the service does not expose any D-Bus properties, so every call
      on that interface is bogus and must be rejected at the bus layer.
    -->
    <!--
      org.freedesktop.DBus.Properties.* は意図的に許可しない。
      本サービスは D-Bus プロパティを公開していないため、当該インタフェース
      への呼び出しは不正でありバス層で拒否する。
    -->

  </policy>

</busconfig>
